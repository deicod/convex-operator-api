apiVersion: v1
kind: ServiceAccount
metadata:
  name: convex-operator-api-db
  namespace: postgres
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: convex-operator-api-db
  namespace: postgres
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["pg-rw-superuser"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: convex-operator-api-db
  namespace: postgres
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: convex-operator-api-db
subjects:
  - kind: ServiceAccount
    name: convex-operator-api-db
    namespace: postgres
