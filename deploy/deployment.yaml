apiVersion: apps/v1
kind: Deployment
metadata:
  name: convex-operator-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: convex-operator-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: convex-operator-api
    spec:
      serviceAccountName: convex-operator-api
      containers:
        - name: api
          image: ghcr.io/your-org/convex-operator-api:latest
          imagePullPolicy: Always
          env:
            - name: LISTEN_ADDRESS
              value: ":8080"
            - name: MODE
              value: "in-cluster"
            - name: CONVEX_API_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: convex-operator-api-auth
                  key: token
                  optional: true
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
