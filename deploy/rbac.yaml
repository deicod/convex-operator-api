apiVersion: v1
kind: ServiceAccount
metadata:
  name: convex-operator-api
  namespace: convex-operator-api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: convex-operator-api
rules:
  - apiGroups: ["convex.icod.de"]
    resources: ["convexinstances", "convexinstances/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: convex-operator-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: convex-operator-api
subjects:
  - kind: ServiceAccount
    name: convex-operator-api
    namespace: convex-operator-api
